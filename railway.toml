# Config-as-code for Railway. The SvelteKit app lives in `app/`; the Dockerfile
# copies that tree so a GitHub-connected service does not need a Root Directory.
# Process startup comes from the image CMD — do not set startCommand here
# (Railway would override the Dockerfile entrypoint).
#
# After the first deploy: Settings → Networking → Generate Domain.

[build]
builder = "DOCKERFILE"
watchPatterns = ["/app/**", "/Dockerfile", "/.dockerignore", "/railway.toml"]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
