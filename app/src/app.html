<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" media="(prefers-color-scheme: light)" />
		<link rel="manifest" href="%sveltekit.assets%/manifest-dark.webmanifest" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		%%DESIGN_FONT_PRELOADS%%
		<style>
%%DESIGN_SYSTEM_CSS%%
		</style>
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="%%DESIGN_PAPER_LIGHT%%" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="%%DESIGN_PAPER_DARK%%" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="%%DESIGN_PAPER_LIGHT%%" data-resolved />
		<script>
			(function () {
				try {
					var t = localStorage.getItem('korean-theme');
					var dark =
						t === 'dark' ||
						(t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (t === 'light' || t === 'dark') {
						document.documentElement.setAttribute('data-theme', t);
						document.documentElement.style.colorScheme = t;
						var cs = document.querySelector('meta[name="color-scheme"]');
						if (cs) cs.setAttribute('content', t);
					}
					var m = document.querySelector('meta[name="theme-color"][data-resolved]');
					if (m) m.setAttribute('content', dark ? '%%DESIGN_PAPER_DARK%%' : '%%DESIGN_PAPER_LIGHT%%');
				} catch (e) {}
			})();
		</script>
		<meta name="description" content="Interactive labs and spaced repetition for reading Korean." />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
