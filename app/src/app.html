<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" media="(prefers-color-scheme: light)" />
		<link rel="manifest" href="%sveltekit.assets%/manifest-dark.webmanifest" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<style>
%%DESIGN_SYSTEM_CSS%%
		</style>
		<meta name="color-scheme" content="light dark" />
		<!-- One tag, no media: the first matching theme-color wins, so OS media tags would beat the in-app toggle. -->
		<meta name="theme-color" content="%%DESIGN_PAPER_LIGHT%%" data-resolved />
		<!-- Theme boot before first paint. Prerender hashes this inline script. -->
		<script>
%%THEME_BOOT%%
		</script>
		<meta name="description" content="Interactive labs and spaced repetition for reading Korean." />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
